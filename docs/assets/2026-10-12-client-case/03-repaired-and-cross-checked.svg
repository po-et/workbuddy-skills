<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><rect x="0" y="0" width="1600" height="920" rx="0" fill="#f3f6f7" stroke="#f3f6f7"/><text x="70" y="70" fill="#51707e" font-size="23" font-weight="600" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">CAPTAIN / WORKBUDDY 实测 · 03 / 修正与复核</text><text x="70" y="140" fill="#132a34" font-size="44" font-weight="700" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">业务差异归零，响应字节仍不相同</text><text x="70" y="190" fill="#52707e" font-size="25" font-weight="400" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">第二轮：重新 GET 修正响应 · verdict=same · CLI 退出码 0 · diff_count=0。</text><rect x="70" y="255" width="700" height="255" rx="16" fill="#e7f2f1" stroke="#beddd9"/><text x="100" y="303" fill="#267c7b" font-size="24" font-weight="600" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">修正后业务字段</text><text x="100" y="393" fill="#107572" font-size="90" font-weight="700" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">0</text><text x="225" y="370" fill="#173b45" font-size="32" font-weight="600" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">处差异</text><text x="225" y="415" fill="#426971" font-size="23" font-weight="400" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">金额、数量、布尔类型、note 已恢复</text><text x="100" y="473" fill="#315a64" font-size="25" font-weight="400" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">same 是应用指定忽略规则后的结果</text><rect x="805" y="255" width="725" height="255" rx="16" fill="#ffffff" stroke="#d7e0e5"/><text x="837" y="303" fill="#577580"