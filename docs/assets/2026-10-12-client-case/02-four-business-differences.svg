91" fill="#64808a" font-size="21" font-weight="400" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">空值与缺失 · 显式空值不等于缺失</text><text x="760" y="663" fill="#234b57" font-size="28" font-weight="600" font-family="&#x27;SFMono-Regular&#x27;,Consolas,&#x27;Liberation Mono&#x27;,monospace">null</text><text x="1030" y="663" fill="#a9571b" font-size="28" font-weight="700" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">字段缺失</text><text x="70" y="845" fill="#55707c" font-size="22" font-weight="400" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">来源：regressed.json 中四个 diffs；金额、数量、类型、字段缺失均来自实际响应比较。</text><text x="70" y="880" fill="#55707c" font-size="22" font-weight="400" font-family="&#x27;PingFang SC&#x27;,&#x27;Noto Sans CJK SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">本轮两端均为 200，未覆盖非 2xx 分支；结果有差异是否为缺陷，仍需对应业务契约判断。</text></svg>
